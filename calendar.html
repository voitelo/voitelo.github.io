<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<style>
body { color: white; font-family: sans-serif; }
.menu { z-index: 10; } /* keeps the dropdown above the calendar so its links are clickable */
.wrap { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
.box { background: rgba(55, 55, 55, 0.75); border: 1px solid aqua; border-radius: 12px; padding: 14px; }
#calendar { flex: 3; min-width: 300px; }
#side { flex: 1; min-width: 240px; }
.top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.top h2 { flex: 1; margin: 0; }
button { background: none; color: white; border: 1px solid transparent; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { background: rgba(128, 128, 128, 0.15); border-color: aqua; }
#grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dow { text-align: center; color: gray; }
.day { height: 60px; text-align: left; background: rgba(255, 255, 255, 0.05); }
.other { opacity: 0.35; }
.today { border-color: aqua; color: aqua; }
.selected { background: rgba(0, 255, 255, 0.15); border-color: aqua; }
.dot { color: aqua; }
input { background: #1a1a1a; color: white; border: 1px solid gray; border-radius: 8px; padding: 8px; width: 100%; box-sizing: border-box; }
li { background: rgba(255, 255, 255, 0.06); border-left: 3px solid aqua; border-radius: 8px; padding: 8px; margin-top: 6px; list-style: none; display: flex; justify-content: space-between; }
ul { padding: 0; }
</style>
</head>
<body>
<h1 style="font-family: 'Arial', sans-serif;">
Daxal
</h1>

<details class="menu">
  <summary>☰</summary>
  <nav>
    <a href="home.html">Home</a>
    <a href="calendar.html">Calendar</a>
    <a href="notes.html">Notes</a>
    <a href="../index.html">go back</a>
  </nav>
</details>

<link rel="stylesheet" href="../style.css">

<div class="wrap">
  <div id="calendar" class="box">
    <div class="top">
      <h2 id="title"></h2>
      <button onclick="goToday()">Today</button>
      <button onclick="move(-1)">‹</button>
      <button onclick="move(1)">›</button>
    </div>
    <div id="grid"></div>
  </div>
  <div id="side" class="box">
    <h3 id="selTitle"></h3>
    <input id="evTitle" placeholder="New event, press Enter" onkeydown="if (event.key == 'Enter') add()">
    <ul id="list"></ul>
  </div>
</div>

<script>
// events look like: { "2026-10-1": ["Dentist", "Gym"] }
var events = JSON.parse(localStorage.getItem("events") || "{}");
var now = new Date();
var year = now.getFullYear();
var month = now.getMonth();
var selected = dateKey(now);

function dateKey(d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function save() { localStorage.setItem("events", JSON.stringify(events)); }

function draw() {
  var first = new Date(year, month, 1);
  document.getElementById("title").textContent = first.toLocaleDateString("en", { month: "long", year: "numeric" });

  var html = "";
  var names = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  for (var n = 0; n < 7; n++) html += "<div class='dow'>" + names[n] + "</div>";

  var start = (first.getDay() + 6) % 7; // week starts on Monday
  for (var i = 0; i < 42; i++) {
    var d = new Date(year, month, 1 - start + i);
    var key = dateKey(d);
    var cls = "day";
    if (d.getMonth() != month) cls += " other";
    if (key == dateKey(now)) cls += " today";
    if (key == selected) cls += " selected";
    var dots = events[key] ? "<br><span class='dot'>" + "•".repeat(Math.min(events[key].length, 5)) + "</span>" : "";
    html += "<button class='" + cls + "' onclick=\"pick('" + key + "')\">" + d.getDate() + dots + "</button>";
  }
  document.getElementById("grid").innerHTML = html;

  var p = selected.split("-");
  document.getElementById("selTitle").textContent = new Date(p[0], p[1] - 1, p[2]).toDateString();
  var list = events[selected] || [];
  var items = "";
  for (var j = 0; j < list.length; j++) {
    items += "<li>" + list[j].replace(/</g, "&lt;") + "<button onclick='del(" + j + ")'>✕</button></li>";
  }
  document.getElementById("list").innerHTML = items;
}

function pick(key) { selected = key; draw(); }

function add() {
  var box = document.getElementById("evTitle");
  var text = box.value.trim();
  if (text == "") return;
  if (!events[selected]) events[selected] = [];
  events[selected].push(text);
  box.value = "";
  save();
  draw();
}

function del(i) {
  events[selected].splice(i, 1);
  if (events[selected].length == 0) delete events[selected];
  save();
  draw();
}

function move(n) {
  month += n;
  if (month < 0) { month = 11; year--; }
  if (month > 11) { month = 0; year++; }
  draw();
}

function goToday() { year = now.getFullYear(); month = now.getMonth(); selected = dateKey(now); draw(); }

draw();
</script>
</body>
</html>
